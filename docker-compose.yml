# Local / single-box setup: Postgres with pgvector + the ATYA app.
#   cp .env.example .env   # fill in the values
#   docker compose up -d --build && docker compose logs -f app
name: atya

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: atya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atya-local}
      POSTGRES_DB: atya
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atya -d atya"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://atya:${POSTGRES_PASSWORD:-atya-local}@db:5432/atya
      OWNER_TIMEZONE: ${OWNER_TIMEZONE:-Asia/Kolkata}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:8080}
    ports:
      - "127.0.0.1:8080:8080"   # web view, this machine only
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
