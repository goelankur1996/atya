<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}ATYA{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <a class="brand" href="{{ url_for('home') }}">ATYA</a>
  {% if tenant %}
  <nav>
    <a href="{{ url_for('home') }}">Records</a>
    <a href="{{ url_for('messages') }}">Messages</a>
    <a href="{{ url_for('db_tables') }}">Database</a>
  </nav>
  <form class="search" action="{{ url_for('search') }}" method="get">
    <input type="search" name="q" placeholder="Search everything" value="{{ q|default('') }}" aria-label="Search">
  </form>
  <form action="{{ url_for('logout') }}" method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button class="link" type="submit">Sign out</button>
  </form>
  {% endif %}
</header>
<main{% block main_class %}{% endblock %}>
{% block body %}{% endblock %}
</main>
</body>
</html>
